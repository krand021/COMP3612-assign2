<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Store Name</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header>
    <a href="#" data-view="homeview" class="logo">Logo</a>

    <nav>
      <a href="#" data-view="homeview">Home</a>
      <a href="#" data-view="browseview">Browse</a>
      <a href="#" data-view="categoryview">Category</a>
      <a href="#" data-view="aboutdialog">About</a>
    </nav>

    <a href="#" data-view="cartview" class="cart-link">
      Cart <span id="cart-count">0</span>
    </a>
  </header>

  <main>
    <!-- Home View: hero image + featured products -->
    <section id="homeview">
    </section>

    <!-- Category View: hero + category thumbnails -->
    <section id="categoryview" class="hidden">
    </section>

    <!-- Browse View: filters + product results -->
    <section id="browseview" class="hidden">
    </section>

    <!-- Single Product View -->
    <section id="productview" class="hidden">
    </section>

    <!-- Shopping Cart View -->
    <section id="cartview" class="hidden">
    </section>
  </main>

  <!-- About Us Dialog -->
  <dialog id="aboutdialog">
  </dialog>

  <footer>
    <a href="https://github.com/YOUR-USERNAME/YOUR-REPO" target="_blank" rel="noopener">GitHub Repo</a>
    <p>COMP 3612 Assignment 2  Mount Royal University</p>
    <p>Jaden Cowie | Kieran Randall</p>

  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
